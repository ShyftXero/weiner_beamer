[project]
name = "weiner-beamer"
version = "0.1.0"
description = "Laser-engraved hotdog queue for Grbl and Marlin laser machines"
readme = "README.md"
authors = [
    { name = "Eli McRae", email = "shyft@shyft.us" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fonttools>=4.66.0",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
weiner-beamer = "weiner_beamer:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
